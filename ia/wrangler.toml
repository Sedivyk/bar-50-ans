# Le relais IA de « Ton bar » (Cloudflare Workers, offre gratuite).
# La clé Gemini n'est jamais ici : `npx wrangler secret put GEMINI_KEY`.
name = "ton-bar-ia"
main = "worker.js"
compatibility_date = "2025-06-01"
# Publié à https://ton-bar-ia.sedivyk.workers.dev
workers_dev = true
preview_urls = false

[vars]
# Seul le site publié peut appeler le relais.
ORIGINES = "https://sedivyk.github.io"
# Le premier modèle essayé ; s'il est débordé, worker.js en essaie d'autres.
MODELE = "gemini-flash-lite-latest"
