<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ton bar · 50 ans</title>
<meta name="description" content="Coche ce que tu as, et vois tout ce que tu peux préparer ce soir.">
<meta name="theme-color" content="#FBEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B0915" media="(prefers-color-scheme: dark)">
<script>try{var t=localStorage.getItem("ton-bar-taille-v1");if(t==="plus"||t==="max")document.documentElement.dataset.taille=t}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ton bar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBEFF2;--surface:#FFFFFF;--ink:#2A0E24;--muted:#5C3D51;--line:#EAD3DB;
  --rose:#B3305B;--rose-soft:#F8DCE5;--gold:#9C6E16;--gold-line:#D9B25E;--miss:#B3305B;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B0915;--surface:#2A1122;--ink:#F8E9F0;--muted:#D2B9C7;--line:#4A2640;
    --rose:#F17A9E;--rose-soft:#46193A;--gold:#E6BC63;--gold-line:#B98E3A;--miss:#F17A9E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B0915;--surface:#2A1122;--ink:#F8E9F0;--muted:#D2B9C7;--line:#4A2640;
  --rose:#F17A9E;--rose-soft:#46193A;--gold:#E6BC63;--gold-line:#B98E3A;--miss:#F17A9E;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
/* Texte grand par défaut, et encore plus grand au choix
   dans Mon bar. Tout le reste est en rem : tout suit. */
html{font-size:19px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html[data-taille="plus"]{font-size:21px}
html[data-taille="max"]{font-size:23px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1rem;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,.fifty,.sig-title{font-family:"Gloock",Georgia,"Times New Roman",serif;font-weight:400}

.hero{display:flex;align-items:flex-end;gap:16px;padding:28px 0 20px}
.fifty{font-size:clamp(4.6rem,22vw,7rem);line-height:.78;color:var(--gold);letter-spacing:-.04em;text-shadow:3px 3px 0 var(--rose-soft)}
.hero h1{margin:0 0 6px;font-size:1.9rem;line-height:1.05}
.hero p{margin:0;color:var(--muted);font-size:1rem;max-width:30ch}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.tab{min-width:0;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:.45em .4em;cursor:pointer;line-height:1.25;overflow-wrap:anywhere}
.tab .n{font-weight:500;opacity:.8}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.chip input:focus-visible+span,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,label.fichier:focus-within{outline:2px solid var(--gold);outline-offset:2px}

.search{width:100%;margin:16px 0 4px;font:inherit;padding:.6em .75em;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.hint{color:var(--muted);font-size:.95rem;margin:8px 0 14px}

/* ruban des occasions : Noël, la piscine, l’Halloween, les ados */
.ambiances{display:flex;gap:7px;margin:12px 0 2px;padding-bottom:4px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ambiances::-webkit-scrollbar{display:none}
.amb{flex:none;font:inherit;font-size:.95rem;font-weight:600;white-space:nowrap;cursor:pointer;
  padding:.4em .85em;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--muted)}
.amb.on{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.ambiances.notes{margin-top:6px}
.filtre-note{font-size:.92rem}

/* les étoiles : cinq, chacune coupée en deux pour les demi-notes */
.note-mini{font-family:"Figtree",system-ui,sans-serif;font-size:.92rem;font-weight:700;color:var(--gold);white-space:nowrap;vertical-align:middle;margin-left:2px}
.ma-note{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line)}
.mes-notes{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line)}
.mes-notes h3{margin:0 0 6px;font-family:"Gloock",Georgia,serif;font-weight:400;font-size:1.2rem;color:var(--gold)}
.commentaire{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.com-mini{font-size:.95rem;color:var(--gold);vertical-align:middle;margin-left:2px}
.ma-note h3{margin:0 0 4px;font-family:"Gloock",Georgia,serif;font-weight:400;font-size:1.2rem;color:var(--gold)}
.note-ligne{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px}
.etoiles{display:inline-flex}
.etoile{position:relative;display:inline-block;width:2.3rem;height:2.4rem;font-size:2rem;line-height:2.4rem;text-align:center}
.etoile::before{content:"★";color:var(--line)}
.etoile .plein{position:absolute;top:0;left:0;bottom:0;width:0;overflow:hidden;pointer-events:none}
.etoile .plein::before{content:"★";display:block;width:2.3rem;text-align:center;color:var(--gold)}
.etoile.f50 .plein{width:50%}
.etoile.f100 .plein{width:100%}
.demi{position:absolute;top:0;bottom:0;width:50%;margin:0;padding:0;border:none;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.demi.g{left:0}
.demi.d{right:0}
.note-val{font-weight:700;font-variant-numeric:tabular-nums}
.tailles{display:flex;gap:8px}
.tailles .amb{flex:1;padding:.45em .2em}
.tailles [data-taille="normal"]{font-size:.95rem}
.tailles [data-taille="plus"]{font-size:1.1rem}
.tailles [data-taille="max"]{font-size:1.25rem}

/* l’onglet « Idées » */
.barre-idees{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:4;margin:22px 0 6px;
  display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:16px;
  background:var(--surface);border:1px solid var(--gold-line);box-shadow:0 6px 24px rgba(0,0,0,.16)}
.barre-idees .gros{flex:1}
#idees-resultats{scroll-margin-top:7.5rem}
.idees-ia>.gros{width:100%;margin:2px 0 14px}
.gros:disabled{opacity:.55;cursor:default}
details.r.ia{border-style:dashed;border-color:var(--gold-line)}
.pour{margin:10px 0 0;font-size:.92rem;color:var(--muted)}
.gardee{color:var(--gold);font-weight:700;font-size:1rem}
.actions .gros{flex:none;padding:11px 16px}
.note-val.vide{font-weight:400;color:var(--muted);font-size:.95rem}

.list{display:flex;flex-direction:column;gap:10px}
details.r{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.r.sig{border:1.5px solid var(--gold-line)}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
.st{flex:1;min-width:0}
.rt{font-weight:700;font-size:1.1rem;line-height:1.3}
.sig .rt{font-family:"Gloock",Georgia,serif;font-weight:400;font-size:1.35rem;color:var(--gold)}
.rs{color:var(--muted);font-size:.95rem;margin-top:3px;line-height:1.35}
.rs.missing{color:var(--miss);font-weight:600}
.mine{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);border:1px solid var(--gold-line);border-radius:999px;padding:1px 7px;vertical-align:middle;white-space:nowrap}
.mine.doux{color:var(--muted);border-color:var(--line)}
.chev{flex:none;width:.65rem;height:.65rem;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details[open] .chev{transform:rotate(225deg)}
.body{padding:0 16px 16px;border-top:1px solid var(--line)}

.thumb{flex:none;width:3.2rem;height:3.2rem;border-radius:11px;overflow:hidden;background:var(--rose-soft);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .glass{width:100%;height:100%;padding:5px}
.photo{margin:14px 0 0;border-radius:12px;overflow:hidden;background:var(--rose-soft);border:1px solid var(--line);aspect-ratio:16/10}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.noimg{display:flex;align-items:center;justify-content:center}
.photo.noimg .glass{width:auto;height:82%}
.credit{margin:6px 2px 0;font-size:.82rem;color:var(--muted)}
.credit a{color:inherit;text-decoration:underline}
.glass{display:block}
.gl-out{fill:none;stroke:var(--gold-line);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.gl-liq{fill:var(--rose);opacity:.38}

.ing{list-style:none;margin:12px 0;padding:0}
.ing li{display:flex;gap:10px;padding:6px 0;font-size:1rem}
.ing .q{flex:none;width:4.2em;color:var(--muted);font-variant-numeric:tabular-nums}
.ing .in{flex:1;min-width:0}
.ing .tq{color:var(--muted)}
.ing .no{color:var(--miss);font-weight:600}
.ing .opt{color:var(--muted);font-size:.92em}
select.pick{display:block;box-sizing:border-box;margin-top:5px;width:100%;max-width:100%;font:inherit;font-size:.95rem;padding:.35em .5em;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.method{margin:6px 0 0;font-size:1rem}
.note{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--rose-soft);font-size:.97rem}

/* idées déco : celles qu’elle peut faire tout de suite sont mises en avant,
   les autres restent là, sans être présentées comme manquantes */
.deco{margin:14px 0 0;padding-top:12px;border-top:1px dashed var(--line)}
.deco h3{margin:0 0 6px;font-family:"Gloock",Georgia,serif;font-weight:400;font-size:1.2rem;color:var(--gold)}
.deco ul{list-style:none;margin:0;padding:0}
.deco li{position:relative;padding:4px 0 4px 22px;font-size:.97rem;color:var(--muted)}
.deco li.a-toi{color:var(--ink);font-weight:600}
.deco li::before{content:"·";position:absolute;left:6px;color:var(--line)}
.deco li.a-toi::before{content:none}
.deco .coche{position:absolute;left:0;color:var(--gold);font-weight:700}

.astuce{margin:0 0 20px}
.astuce h3{margin:0 0 6px;font-family:"Gloock",Georgia,serif;font-weight:400;font-size:1.25rem;color:var(--gold)}
.astuce p{margin:0 0 8px;font-size:1rem}
.lien{margin:10px 0 0;font-size:.95rem}
.lien a{color:var(--rose)}
.actions{margin-top:14px;display:flex;gap:16px;align-items:center}

.cat h2{font-size:1.45rem;margin:28px 0 12px}
.sous{font-size:1.15rem;margin:18px 0 8px;font-family:"Gloock",Georgia,serif;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-rang{display:inline-flex;align-items:center;gap:2px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:.45em .8em;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .box{font-size:.78rem;font-weight:700;color:var(--gold);border:1px solid var(--gold-line);border-radius:999px;padding:0 6px}
.chip input:checked+span .box{color:var(--gold-line)}
.fiche{font:inherit;font-size:1rem;line-height:1;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;width:2.2rem;height:2.2rem;cursor:pointer;flex:none}

.gros-boutons{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.gros{flex:1 1 46%;font:inherit;font-weight:700;font-size:1rem;background:var(--ink);color:var(--bg);border:none;border-radius:12px;padding:13px 14px;cursor:pointer;text-align:center}
.gros.doux{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
label.fichier{cursor:pointer}
.reset{margin-top:28px;font:inherit;font-size:.97rem;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0}
.lien-btn{font:inherit;font-size:.97rem;background:none;border:none;color:var(--rose);text-decoration:underline;cursor:pointer;padding:4px 0}
.lien-btn.danger{color:var(--miss)}
.empty{padding:28px 6px;color:var(--muted);text-align:center}

.install{margin:18px 0 4px;padding:14px 16px;border:1px solid var(--gold-line);border-radius:14px;background:var(--surface)}
.install h2{font-size:1.25rem;margin:0 0 6px}
.install p{margin:0;font-size:.97rem;color:var(--muted)}
.install b{color:var(--ink);font-weight:600}

.loading{padding:40px 6px;color:var(--muted);text-align:center;font-size:1rem}
.retry{margin-top:14px;font:inherit;font-size:1rem;font-weight:600;background:var(--ink);color:var(--bg);border:none;border-radius:999px;padding:10px 20px;cursor:pointer}

/* fenêtres */
dialog#dlg{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0 auto;width:100%;max-width:640px;
  border:none;padding:0;background:var(--surface);color:var(--ink);
  border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);max-height:92vh;max-height:92dvh}
dialog#dlg::backdrop{background:rgba(26,8,20,.55)}
.feuille{display:flex;flex-direction:column;max-height:92vh;max-height:92dvh}
.feuille header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.feuille h2{margin:0;font-size:1.4rem}
.fermer{font:inherit;font-size:1.3rem;line-height:1;background:none;border:none;color:var(--ink);cursor:pointer;padding:8px 10px}
.contenu{overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.ch{display:block;margin:0 0 15px}
.ch>span{display:block;font-weight:700;font-size:1rem;margin-bottom:5px}
.ch small{display:block;color:var(--muted);font-size:.9rem;margin-top:5px}
.ch input[type=text],.ch input[type=url],.ch select,.ch textarea{
  width:100%;font:inherit;padding:11px 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ch textarea{resize:vertical}
.boutons{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:20px}
.boutons .gros{width:100%;flex:none}
.erreur{color:var(--miss);font-size:1rem;font-weight:600;margin:0 0 6px}
.fiche-liste{list-style:none;margin:0;padding:0}
.fiche-liste li{padding:3px 0}

.ing-ligne{display:grid;grid-template-columns:4.6em 1fr auto;gap:7px;align-items:center;margin-bottom:8px}
.ing-ligne input[type=text]{width:100%;font:inherit;font-size:1rem;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ing-opt{grid-column:2;font-size:.9rem;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:-3px}
.ing-moins{grid-row:1;grid-column:3;font:inherit;font-size:1.2rem;line-height:1;width:2.1rem;height:2.1rem;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.photo-apercu:not(:empty){margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:var(--rose-soft)}
.photo-apercu img{width:100%;height:100%;object-fit:cover;display:block}

.message{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;
  max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);
  padding:12px 16px;border-radius:12px;font-size:1rem;box-shadow:0 6px 24px rgba(0,0,0,.24)}
.message.probleme{background:var(--miss);color:#fff}

footer{margin-top:40px;text-align:center;font-family:"Gloock",Georgia,serif;font-size:1.25rem;color:var(--rose)}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="fifty" aria-hidden="true">50</div>
    <div>
      <h1>Ton bar</h1>
      <p>Coche ce que tu as, et vois tout ce que tu peux préparer ce soir.</p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="t-ok" aria-selected="true" data-view="ok">Je peux faire <span class="n" id="n-ok"></span></button>
    <button class="tab" role="tab" id="t-near" aria-selected="false" data-view="near">Presque <span class="n" id="n-near"></span></button>
    <button class="tab" role="tab" id="t-bar" aria-selected="false" data-view="bar">Mon bar</button>
    <button class="tab" role="tab" id="t-idees" aria-selected="false" data-view="idees">Idées</button>
  </nav>

  <main id="main" aria-live="polite"><p class="loading">Un instant, on ouvre le bar…</p></main>
  <footer>Joyeux 50ᵉ, et santé !</footer>
</div>

<dialog id="dlg" aria-label="Fenêtre"></dialog>
<p class="message" id="message" role="status" hidden></p>

<script type="module" src="app/main.js"></script>
</body>
</html>
