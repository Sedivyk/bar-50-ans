<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ton bar · 50 ans</title>
<meta name="description" content="Coche ce que tu as, et vois tout ce que tu peux préparer ce soir.">
<meta name="theme-color" content="#FBEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B0915" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ton bar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBEFF2;--surface:#FFFFFF;--ink:#2A0E24;--muted:#76566A;--line:#EAD3DB;
  --rose:#B3305B;--rose-soft:#F8DCE5;--gold:#9C6E16;--gold-line:#D9B25E;--miss:#B3305B;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B0915;--surface:#2A1122;--ink:#F8E9F0;--muted:#BE9FB1;--line:#4A2640;
    --rose:#F17A9E;--rose-soft:#46193A;--gold:#E6BC63;--gold-line:#B98E3A;--miss:#F17A9E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B0915;--surface:#2A1122;--ink:#F8E9F0;--muted:#BE9FB1;--line:#4A2640;
  --rose:#F17A9E;--rose-soft:#46193A;--gold:#E6BC63;--gold-line:#B98E3A;--miss:#F17A9E;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 48px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,.fifty,.sig-title{font-family:"Gloock",Georgia,"Times New Roman",serif;font-weight:400}

.hero{display:flex;align-items:flex-end;gap:16px;padding:28px 0 20px}
.fifty{font-size:clamp(5.5rem,24vw,8.5rem);line-height:.78;color:var(--gold);letter-spacing:-.04em;text-shadow:3px 3px 0 var(--rose-soft)}
.hero h1{margin:0 0 6px;font-size:2rem;line-height:1.05}
.hero p{margin:0;color:var(--muted);font-size:.95rem;max-width:30ch}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.tab{flex:1;font:inherit;font-weight:600;font-size:.92rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 6px;cursor:pointer;white-space:nowrap}
.tab .n{font-weight:500;opacity:.8}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.chip input:focus-visible+span,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,label.fichier:focus-within{outline:2px solid var(--gold);outline-offset:2px}

.search{width:100%;margin:16px 0 4px;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.hint{color:var(--muted);font-size:.88rem;margin:8px 0 14px}

.list{display:flex;flex-direction:column;gap:10px}
details.r{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.r.sig{border:1.5px solid var(--gold-line)}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
.st{flex:1;min-width:0}
.rt{font-weight:700;font-size:1.04rem}
.sig .rt{font-family:"Gloock",Georgia,serif;font-weight:400;font-size:1.3rem;color:var(--gold)}
.rs{color:var(--muted);font-size:.86rem;margin-top:2px}
.rs.missing{color:var(--miss);font-weight:600}
.mine{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--gold);border:1px solid var(--gold-line);border-radius:999px;padding:1px 7px;vertical-align:middle;white-space:nowrap}
.chev{flex:none;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details[open] .chev{transform:rotate(225deg)}
.body{padding:0 16px 16px;border-top:1px solid var(--line)}

.thumb{flex:none;width:54px;height:54px;border-radius:11px;overflow:hidden;background:var(--rose-soft);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .glass{width:100%;height:100%;padding:5px}
.photo{margin:14px 0 0;border-radius:12px;overflow:hidden;background:var(--rose-soft);border:1px solid var(--line);aspect-ratio:16/10}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.noimg{display:flex;align-items:center;justify-content:center}
.photo.noimg .glass{width:auto;height:82%}
.credit{margin:6px 2px 0;font-size:.76rem;color:var(--muted)}
.credit a{color:inherit;text-decoration:underline}
.glass{display:block}
.gl-out{fill:none;stroke:var(--gold-line);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.gl-liq{fill:var(--rose);opacity:.38}

.ing{list-style:none;margin:12px 0;padding:0}
.ing li{display:flex;gap:10px;padding:5px 0;font-size:.95rem}
.ing .q{flex:none;width:4.4em;color:var(--muted);font-variant-numeric:tabular-nums}
.ing .in{flex:1;min-width:0}
.ing .tq{color:var(--muted)}
.ing .no{color:var(--miss);font-weight:600}
.ing .opt{color:var(--muted);font-size:.85em}
select.pick{display:block;margin-top:5px;max-width:100%;font:inherit;font-size:.88rem;padding:5px 8px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.method{margin:6px 0 0;font-size:.95rem}
.note{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--rose-soft);font-size:.9rem}
.lien{margin:10px 0 0;font-size:.88rem}
.lien a{color:var(--rose)}
.actions{margin-top:14px;display:flex;gap:16px;align-items:center}

.cat h2{font-size:1.35rem;margin:26px 0 10px}
.sous{font-size:1.05rem;margin:18px 0 8px;font-family:"Gloock",Georgia,serif;font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-rang{display:inline-flex;align-items:center;gap:2px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.92rem;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .box{font-size:.72rem;font-weight:700;color:var(--gold);border:1px solid var(--gold-line);border-radius:999px;padding:0 6px}
.chip input:checked+span .box{color:var(--gold-line)}
.fiche{font:inherit;font-size:1rem;line-height:1;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;width:32px;height:32px;cursor:pointer;flex:none}

.gros-boutons{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.gros{flex:1 1 46%;font:inherit;font-weight:600;font-size:.95rem;background:var(--ink);color:var(--bg);border:none;border-radius:12px;padding:13px 14px;cursor:pointer;text-align:center}
.gros.doux{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
label.fichier{cursor:pointer}
.reset{margin-top:28px;font:inherit;font-size:.9rem;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0}
.lien-btn{font:inherit;font-size:.9rem;background:none;border:none;color:var(--rose);text-decoration:underline;cursor:pointer;padding:4px 0}
.lien-btn.danger{color:var(--miss)}
.empty{padding:28px 6px;color:var(--muted);text-align:center}

.install{margin:18px 0 4px;padding:14px 16px;border:1px solid var(--gold-line);border-radius:14px;background:var(--surface)}
.install h2{font-size:1.15rem;margin:0 0 6px}
.install p{margin:0;font-size:.9rem;color:var(--muted)}
.install b{color:var(--ink);font-weight:600}

.loading{padding:40px 6px;color:var(--muted);text-align:center;font-size:.95rem}
.retry{margin-top:14px;font:inherit;font-size:.95rem;font-weight:600;background:var(--ink);color:var(--bg);border:none;border-radius:999px;padding:10px 20px;cursor:pointer}

/* fenêtres */
dialog#dlg{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0 auto;width:100%;max-width:640px;
  border:none;padding:0;background:var(--surface);color:var(--ink);
  border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.28);max-height:92vh;max-height:92dvh}
dialog#dlg::backdrop{background:rgba(26,8,20,.55)}
.feuille{display:flex;flex-direction:column;max-height:92vh;max-height:92dvh}
.feuille header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.feuille h2{margin:0;font-size:1.3rem}
.fermer{font:inherit;font-size:1.1rem;line-height:1;background:none;border:none;color:var(--muted);cursor:pointer;padding:6px 8px}
.contenu{overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 18px calc(20px + env(safe-area-inset-bottom,0px))}
.ch{display:block;margin:0 0 15px}
.ch>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px}
.ch small{display:block;color:var(--muted);font-size:.8rem;margin-top:5px}
.ch input[type=text],.ch input[type=url],.ch select,.ch textarea{
  width:100%;font:inherit;padding:11px 12px;border-radius:11px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ch textarea{resize:vertical}
.boutons{display:flex;flex-direction:column;gap:8px;align-items:center;margin-top:20px}
.boutons .gros{width:100%;flex:none}
.erreur{color:var(--miss);font-size:.9rem;font-weight:600;margin:0 0 6px}
.fiche-liste{list-style:none;margin:0;padding:0}
.fiche-liste li{padding:3px 0}

.ing-ligne{display:grid;grid-template-columns:5.2em 1fr auto;gap:7px;align-items:center;margin-bottom:8px}
.ing-ligne input[type=text]{width:100%;font:inherit;font-size:.92rem;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ing-opt{grid-column:2;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:5px;margin-top:-3px}
.ing-moins{grid-row:1;grid-column:3;font:inherit;font-size:1.2rem;line-height:1;width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.photo-apercu:not(:empty){margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:var(--rose-soft)}
.photo-apercu img{width:100%;height:100%;object-fit:cover;display:block}

.message{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;
  max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);
  padding:12px 16px;border-radius:12px;font-size:.92rem;box-shadow:0 6px 24px rgba(0,0,0,.24)}
.message.probleme{background:var(--miss);color:#fff}

footer{margin-top:40px;text-align:center;font-family:"Gloock",Georgia,serif;font-size:1.25rem;color:var(--rose)}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="fifty" aria-hidden="true">50</div>
    <div>
      <h1>Ton bar</h1>
      <p>Coche ce que tu as, et vois tout ce que tu peux préparer ce soir.</p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="t-ok" aria-selected="true" data-view="ok">Je peux faire <span class="n" id="n-ok"></span></button>
    <button class="tab" role="tab" id="t-near" aria-selected="false" data-view="near">Presque <span class="n" id="n-near"></span></button>
    <button class="tab" role="tab" id="t-bar" aria-selected="false" data-view="bar">Mon bar</button>
  </nav>

  <main id="main" aria-live="polite"><p class="loading">Un instant, on ouvre le bar…</p></main>
  <footer>Joyeux 50ᵉ, et santé !</footer>
</div>

<dialog id="dlg" aria-label="Fenêtre"></dialog>
<p class="message" id="message" role="status" hidden></p>

<script type="module" src="app/main.js"></script>
</body>
</html>
