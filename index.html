<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Ton bar · 50 ans</title>
<meta name="description" content="Coche ce que tu as, et vois tout ce que tu peux préparer ce soir.">
<meta name="theme-color" content="#FBEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B0915" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ton bar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBEFF2;--surface:#FFFFFF;--ink:#2A0E24;--muted:#76566A;--line:#EAD3DB;
  --rose:#B3305B;--rose-soft:#F8DCE5;--gold:#9C6E16;--gold-line:#D9B25E;--miss:#B3305B;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B0915;--surface:#2A1122;--ink:#F8E9F0;--muted:#BE9FB1;--line:#4A2640;
    --rose:#F17A9E;--rose-soft:#46193A;--gold:#E6BC63;--gold-line:#B98E3A;--miss:#F17A9E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B0915;--surface:#2A1122;--ink:#F8E9F0;--muted:#BE9FB1;--line:#4A2640;
  --rose:#F17A9E;--rose-soft:#46193A;--gold:#E6BC63;--gold-line:#B98E3A;--miss:#F17A9E;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 48px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,.fifty,.sig-title{font-family:"Gloock",Georgia,"Times New Roman",serif;font-weight:400}

.hero{display:flex;align-items:flex-end;gap:16px;padding:28px 0 20px}
.fifty{font-size:clamp(5.5rem,24vw,8.5rem);line-height:.78;color:var(--gold);letter-spacing:-.04em;text-shadow:3px 3px 0 var(--rose-soft)}
.hero h1{margin:0 0 6px;font-size:2rem;line-height:1.05}
.hero p{margin:0;color:var(--muted);font-size:.95rem;max-width:30ch}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.tab{flex:1;font:inherit;font-weight:600;font-size:.92rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 6px;cursor:pointer;white-space:nowrap}
.tab .n{font-weight:500;opacity:.8}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.chip input:focus-visible+span,summary:focus-visible,input[type=search]:focus-visible,.reset:focus-visible,.retry:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.search{width:100%;margin:16px 0 4px;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.hint{color:var(--muted);font-size:.88rem;margin:8px 0 14px}

.list{display:flex;flex-direction:column;gap:10px}
details.r{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.r.sig{border:1.5px solid var(--gold-line)}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
summary::-webkit-details-marker{display:none}
.rt{font-weight:700;font-size:1.04rem}
.sig .rt{font-family:"Gloock",Georgia,serif;font-weight:400;font-size:1.3rem;color:var(--gold)}
.rs{color:var(--muted);font-size:.86rem;margin-top:2px}
.rs.missing{color:var(--miss);font-weight:600}
.chev{flex:none;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
details[open] .chev{transform:rotate(225deg)}
.body{padding:0 16px 16px;border-top:1px solid var(--line)}
.ing{list-style:none;margin:12px 0;padding:0}
.ing li{display:flex;gap:10px;padding:5px 0;font-size:.95rem}
.ing .q{flex:none;width:4.4em;color:var(--muted);font-variant-numeric:tabular-nums}
.ing .no{color:var(--miss);font-weight:600}
.ing .opt{color:var(--muted);font-size:.85em}
.method{margin:6px 0 0;font-size:.95rem}
.note{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--rose-soft);font-size:.9rem}

.cat h2{font-size:1.35rem;margin:26px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.92rem;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .box{font-size:.72rem;font-weight:700;color:var(--gold);border:1px solid var(--gold-line);border-radius:999px;padding:0 6px}
.chip input:checked+span .box{color:var(--gold-line)}
.reset{margin-top:28px;font:inherit;font-size:.9rem;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0}
.empty{padding:28px 6px;color:var(--muted);text-align:center}

/* Astuce « ajouter à l’écran d’accueil » (masquée une fois installée) */
.install{margin:18px 0 4px;padding:14px 16px;border:1px solid var(--gold-line);border-radius:14px;background:var(--surface)}
.install h2{font-size:1.15rem;margin:0 0 6px}
.install p{margin:0;font-size:.9rem;color:var(--muted)}
.install b{color:var(--ink);font-weight:600}

/* Chargement et panne de chargement */
.loading{padding:40px 6px;color:var(--muted);text-align:center;font-size:.95rem}
.retry{margin-top:14px;font:inherit;font-size:.95rem;font-weight:600;background:var(--ink);color:var(--bg);border:none;border-radius:999px;padding:10px 20px;cursor:pointer}

footer{margin-top:40px;text-align:center;font-family:"Gloock",Georgia,serif;font-size:1.25rem;color:var(--rose)}
@media (prefers-reduced-motion: reduce){.chev{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="fifty" aria-hidden="true">50</div>
    <div>
      <h1>Ton bar</h1>
      <p>Coche ce que tu as, et vois tout ce que tu peux préparer ce soir.</p>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" id="t-ok" aria-selected="true" data-view="ok">Je peux faire <span class="n" id="n-ok"></span></button>
    <button class="tab" role="tab" id="t-near" aria-selected="false" data-view="near">Presque <span class="n" id="n-near"></span></button>
    <button class="tab" role="tab" id="t-bar" aria-selected="false" data-view="bar">Mon bar</button>
  </nav>

  <main id="main" aria-live="polite"><p class="loading">Un instant, on ouvre le bar…</p></main>
  <footer>Joyeux 50ᵉ, et santé !</footer>
</div>

<script>
"use strict";

/* ---------- données (chargées depuis data/) ---------- */
let ING = {};   // id -> {id, nom, categorie, defaut, boite}
let CATS = [];  // ordre d’affichage des catégories
let R = [];     // recettes
let ready = false;

async function fetchJSON(url){
  const res = await fetch(url, {credentials:"same-origin"});
  if(!res.ok) throw new Error(url + " : " + res.status);
  return res.json();
}

async function loadData(){
  const [ingData, recData] = await Promise.all([
    fetchJSON("data/ingredients.json"),
    fetchJSON("data/recettes.json")
  ]);
  ING = {};
  for(const i of ingData.ingredients) ING[i.id] = i;
  CATS = ingData.categories.slice();
  // on ignore une recette qui pointerait vers une bouteille disparue
  R = recData.filter(r => r.ingredients.every(x => x.ids.some(id => id in ING)));
}

/* ---------- inventaire (localStorage) ---------- */
const KEY = "ton-bar-50-v1";
let have = {};
function defaults(){ const h={}; for(const id in ING) h[id]=!!ING[id].defaut; return h; }
function load(){
  have = defaults();
  try{ const s = localStorage.getItem(KEY); if(s){ const o = JSON.parse(s); for(const id in o) if(id in ING) have[id]=!!o[id]; } }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(have)); }catch(e){} }

/* ---------- rendu ---------- */
function evalRecipe(r){
  const missing=[];
  for(const x of r.ingredients){ if(!x.facultatif && !x.ids.some(id=>have[id])) missing.push(x.ids); }
  return missing;
}
function label(ids){
  const own = ids.find(id=>have[id]);
  if(own) return ING[own].nom;
  return ids.map(id=>ING[id].nom).join(" ou ");
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function recipeHTML(r, missing){
  const ings = r.ingredients.map(x=>{
    const ok = x.ids.some(id=>have[id]);
    const cls = ok ? "" : (x.facultatif ? "" : "no");
    const tag = x.facultatif ? ' <span class="opt">(facultatif)</span>' : (ok ? "" : " — à acheter");
    return `<li><span class="q">${esc(x.q)}</span><span class="${cls}">${esc(label(x.ids))}${tag}</span></li>`;
  }).join("");
  const main = r.ingredients.filter(x=>!x.facultatif).slice(0,2).map(x=>label(x.ids)).join(", ");
  const sub = missing.length ? `<div class="rs missing">Il manque : ${esc(missing.map(label).join(", "))}</div>` : `<div class="rs">${esc(main)}</div>`;
  return `<details class="r${r.signature?" sig":""}" data-id="${esc(r.id)}"><summary><div><div class="rt">${esc(r.nom)}</div>${sub}</div><span class="chev" aria-hidden="true"></span></summary>
  <div class="body"><ul class="ing">${ings}</ul><p class="method">${esc(r.methode)}</p>${r.note?`<p class="note">${esc(r.note)}</p>`:""}</div></details>`;
}

let view="ok", query="";
function counts(){
  let ok=0, near=0;
  for(const r of R){ const m=evalRecipe(r).length; if(m===0) ok++; else if(m===1) near++; }
  document.getElementById("n-ok").textContent = ok;
  document.getElementById("n-near").textContent = near;
}

function isInstalled(){
  try{
    return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  }catch(e){ return false; }
}

function render(){
  if(!ready) return;
  counts();
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.view===view ? "true":"false"));
  const main = document.getElementById("main");

  if(view==="bar"){
    let html = "";
    if(!isInstalled()){
      html += `<section class="install"><h2>Garde-le sur ton écran d’accueil</h2>
        <p>Sur iPhone : touche <b>Partager</b> (le carré avec la flèche, en bas de Safari), puis <b>Sur l’écran d’accueil</b>. Ton bar s’ouvre alors comme une application, même sans réseau.</p></section>`;
    }
    html += `<p class="hint">Touche une bouteille pour l’ajouter ou la retirer.</p>`;
    for(const c of CATS){
      const ids = Object.keys(ING).filter(id=>ING[id].categorie===c);
      if(!ids.length) continue;
      html += `<section class="cat"><h2>${esc(c)}</h2><div class="chips">` + ids.map(id=>
        `<label class="chip"><input type="checkbox" data-id="${esc(id)}" ${have[id]?"checked":""}><span>${esc(ING[id].nom)}${ING[id].boite?' <b class="box">boîte</b>':""}</span></label>`
      ).join("") + `</div></section>`;
    }
    html += `<button class="reset" id="reset">Revenir à la liste de départ</button>`;
    main.innerHTML = html;
    main.querySelectorAll("input[type=checkbox]").forEach(cb=>cb.addEventListener("change",e=>{ have[e.target.dataset.id]=e.target.checked; save(); counts(); }));
    document.getElementById("reset").addEventListener("click",()=>{ have=defaults(); save(); render(); });
    return;
  }

  const q = query.trim().toLowerCase();
  const list = R.map(r=>({r, m:evalRecipe(r)}))
    .filter(x=> view==="ok" ? x.m.length===0 : x.m.length===1)
    .filter(x=> !q || x.r.nom.toLowerCase().includes(q) || x.r.ingredients.some(y=>y.ids.some(id=>ING[id].nom.toLowerCase().includes(q))));
  const hint = view==="ok" ? "Tout ce que tu peux préparer avec ce que tu as. Touche un cocktail pour la recette." : "Il ne manque qu’un ingrédient. Une petite course, et c’est prêt.";
  main.innerHTML = `<input class="search" type="search" id="q" placeholder="Chercher un cocktail ou une bouteille" value="${esc(query)}" aria-label="Chercher">
    <p class="hint">${hint}</p>
    <div class="list">${list.length ? list.map(x=>recipeHTML(x.r,x.m)).join("") : `<p class="empty">${q ? "Aucun cocktail ne correspond. Essaie le nom d’une bouteille." : "Rien ici pour l’instant. Ajoute des bouteilles dans Mon bar."}</p>`}</div>`;
  const input = document.getElementById("q");
  input.addEventListener("input",e=>{ query=e.target.value; const pos=e.target.selectionStart; render(); const i2=document.getElementById("q"); i2.focus(); i2.setSelectionRange(pos,pos); });
}

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{ view=t.dataset.view; render(); window.scrollTo({top:0}); }));

/* ---------- démarrage ---------- */
function showError(){
  document.getElementById("main").innerHTML =
    `<p class="loading">Les recettes n’ont pas pu être chargées.<br>Vérifie ta connexion, puis réessaie.<br>
     <button class="retry" id="retry">Réessayer</button></p>`;
  document.getElementById("retry").addEventListener("click", boot);
}

async function boot(){
  document.getElementById("main").innerHTML = `<p class="loading">Un instant, on ouvre le bar…</p>`;
  try{
    await loadData();
    load();
    ready = true;
    render();
  }catch(e){
    ready = false;
    showError();
  }
}
boot();

/* ---------- service worker (hors ligne) ---------- */
if("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load",()=>{
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    let refreshing = false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{
      if(!hadController) return;  // toute première installation : rien à recharger
      if(refreshing) return;      // une seule fois, pas de boucle de rechargement
      refreshing = true;
      location.reload();
    });
  });
}
</script>
</body>
</html>
